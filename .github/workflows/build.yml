# Compiles the plugin against the real RuneLite client jar on every push.
# Green check = safe to bump the commit pin in the plugin-hub PR.
name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build and test
        run: gradle build --no-daemon
